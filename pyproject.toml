[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "film-grip"
version = "0.1.0"
description = "react-grab for video editors: select clips, prompt, and Claude auto-edits across DaVinci Resolve, Premiere, Filmora and more via a universal OTIO IR + typed edit protocol."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jack Lau" }]
keywords = ["video-editing", "davinci-resolve", "premiere", "opentimelineio", "claude", "mcp", "ai"]

# Base deps — what the core IR / protocol / serializer / CLI need to run and what
# the D1 smoke test imports. Heavy/optional integrations live in extras so a flaky
# transitive dependency never breaks the foundation.
dependencies = [
  "opentimelineio==0.18.1",
  "pydantic>=2.6",
  "lxml>=5.0",
  "mcp>=1.0",
]

[project.optional-dependencies]
# Claude Agent SDK (D9/D16). Kept optional so core tests run without it; the MCP
# host imports defensively and tests stub the SDK transport.
agent = ["claude-agent-sdk>=0.1.0"]
# Avid AAF read/write (D11)
aaf = ["pyaaf2>=1.7"]
# Interchange adapters: FCPXML (FCP7 + FCPX), EDL/CMX3600, AAF, ALE, kdenlive, etc.
interchange = ["OpenTimelineIO-Plugins>=0.17", "otio-fcpx-xml-adapter>=0.1"]
# Local word-level ASR for the perception layer (transcribe/analyze/cut-by-words). Optional:
# whisper.cpp (CLI) or ElevenLabs Scribe (API) work without it; tests use a fake backend.
transcribe = ["faster-whisper>=1.0"]
# Color scopes (parade/waveform/vectorscope/white-balance) for agentic grading. numpy powers the
# pixel statistics; ffmpeg (system binary) extracts frames. Optional so core stays lean.
color = ["numpy>=1.24"]
# Everything, for a full local dev/install.
all = ["claude-agent-sdk>=0.1.0", "pyaaf2>=1.7", "OpenTimelineIO-Plugins>=0.17",
       "otio-fcpx-xml-adapter>=0.1", "faster-whisper>=1.0", "numpy>=1.24"]
# Dev/test: includes interchange adapters + numpy so the full suite runs.
dev = ["pytest>=8.0", "OpenTimelineIO-Plugins>=0.17", "otio-fcpx-xml-adapter>=0.1", "numpy>=1.24"]

[project.scripts]
film-grip = "filmgrip.cli:main"

[tool.setuptools.packages.find]
include = ["filmgrip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "live: tests that require a running editor (DaVinci Resolve); auto-skipped when the app is unreachable",
]
