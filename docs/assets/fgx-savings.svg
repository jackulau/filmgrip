<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="FGX token savings: a multi-kilobyte FCPXML selection becomes a few hundred tokens">
  <rect x="8" y="8" width="904" height="284" rx="14" fill="#161b22" stroke="#30363d"/>

  <text x="36" y="46" font-size="20" font-weight="700" fill="#e6edf3">FGX — a token-frugal projection</text>
  <text x="36" y="69" font-size="13.5" fill="#8b949e">A selection that is multiple kilobytes of FCPXML becomes a few hundred tokens Claude actually reads.</text>

  <!-- bar A: raw -->
  <text x="40" y="120" font-size="13" fill="#c9d1d9">Raw FCPXML selection</text>
  <rect x="40" y="130" width="660" height="36" rx="7" fill="#2a2310" stroke="#d29922"/>
  <text x="684" y="153" text-anchor="end" font-size="13" font-weight="600" fill="#e6b455">≈ 4,000+ tokens</text>

  <!-- bar B: fgx -->
  <text x="40" y="196" font-size="13" fill="#c9d1d9">FGX bundle  ·  selected subgraph + 1-hop neighbours</text>
  <rect x="40" y="206" width="52" height="36" rx="7" fill="#0f2417" stroke="#3fb950"/>
  <text x="104" y="229" font-size="13" font-weight="600" fill="#56d364">≈ 300 tokens</text>

  <!-- stat panel -->
  <rect x="720" y="126" width="164" height="120" rx="12" fill="#10243f" stroke="#30363d"/>
  <text x="802" y="188" text-anchor="middle" font-size="44" font-weight="800" fill="#58a6ff">≈13×</text>
  <text x="802" y="214" text-anchor="middle" font-size="12.5" fill="#8b949e">fewer tokens</text>
  <text x="802" y="232" text-anchor="middle" font-size="11" fill="#6e7681">integer frames · by-ref media</text>

  <text x="40" y="276" font-size="11" fill="#6e7681">Illustrative — the exact ratio scales with selection size. Every film-grip run prints the real token + cost numbers.</text>
</svg>
